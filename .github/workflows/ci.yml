name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies without automatic scripts
        run: npm ci --ignore-scripts
      - name: Prepare local grammar engine
        run: npm run setup:harper
      - name: Run regression tests
        run: npm test
      - name: Verify static distribution
        run: npm run build
      - name: Audit dependencies
        run: npm audit --audit-level=high
