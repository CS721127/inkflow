name: macOS app

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'desktop/**'
      - 'scripts/**'
      - 'js/**'
      - 'css/**'
      - 'index.html'
      - 'package*.json'
      - '.github/workflows/macos-release.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build and test ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Check release tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p 'require("./package.json").version')
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Install locked dependencies without automatic scripts
        run: npm ci --ignore-scripts
      - name: Prepare bundled runtimes
        run: |
          npm run setup:harper
          node node_modules/electron/install.js
      - name: Run regression tests and audit
        run: |
          npm test
          npm audit --audit-level=high
      - name: Build and smoke-test the offline editor
        run: |
          npm run build
          npm run test:desktop
      - name: Package Mac app
        run: npx --no-install electron-builder --mac --${{ matrix.arch }} --publish never
      - name: Verify ad-hoc signature
        run: codesign --verify --deep --strict "release/mac${{ matrix.arch == 'arm64' && '-arm64' || '' }}/InkFlow.app"
      - uses: actions/upload-artifact@v4
        with:
          name: inkflow-mac-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-checks-${{ matrix.arch }}
          path: desktop-smoke-output/

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: inkflow-mac-*
          merge-multiple: true
          path: release
      - name: Create checksums
        working-directory: release
        run: sha256sum *.dmg *.zip > SHA256SUMS.txt
      - name: Publish tested installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.dmg release/*.zip release/SHA256SUMS.txt --verify-tag --draft --title "InkFlow $GITHUB_REF_NAME — Mac app" --notes-file docs/RELEASE_NOTES.md
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
